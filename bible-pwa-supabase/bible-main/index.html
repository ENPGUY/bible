<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a6cf7">
  <title>오늘의 성경말씀</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="container">
  <header class="topbar"><div><h1>오늘의 성경말씀</h1><p>오늘 나에게 필요한 말씀을 만나보세요.</p></div><div id="authArea"></div></header>
  <section class="card">
    <span id="category" class="badge">불러오는 중</span>
    <div id="verse" class="verse">Supabase에서 말씀을 불러오고 있습니다.</div>
    <div id="reference" class="reference"></div>
    <div class="description-box"><strong>말씀 묵상</strong><p id="description"></p></div>
    <div class="actions"><button id="randomBtn">말씀 새로 보기</button><button id="favoriteBtn" class="secondary" disabled>♡ 저장</button></div>
    <p id="status" class="status"></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/config.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
