let lastIndex = -1;

function showRandomVerse() {

  let randomIndex;

  // 바로 직전에 나온 말씀이 연속으로 나오지 않게 처리
  do {
    randomIndex = Math.floor(Math.random() * verses.length);
  } while (randomIndex === lastIndex && verses.length > 1);

  lastIndex = randomIndex;

  const selectedVerse = verses[randomIndex];

  document.getElementById("verse").innerText =
    selectedVerse.text;

  document.getElementById("reference").innerText =
    selectedVerse.reference;

  document.getElementById("category").innerText =
    selectedVerse.category;

  document.getElementById("description").innerText =
    selectedVerse.description;
}
